{"name": "Notifications Dis-moi tout",
"on": {"schedule": [{"cron": "*/30 * * * *"}], "workflow_dispatch": null},
"concurrency": {"group": "notifier", "cancel-in-progress": false},
"jobs": {"notifier": {"runs-on": "ubuntu-latest", "timeout-minutes": 5, "steps": [
{"uses": "actions/checkout@v4"},
{"run": "for f in run.js logic.js choices.js; do if [ -f \"$f\" ]; then cp \"$f\" notifier/; fi; done"},
{"uses": "actions/setup-node@v4", "with": {"node-version": 22}},
{"run": "npm install --no-audit --no-fund", "working-directory": "notifier"},
{"run": "node run.js", "working-directory": "notifier", "env": {
"FIREBASE_SERVICE_ACCOUNT": "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}",
"GMAIL_USER": "${{ secrets.GMAIL_USER }}",
"GMAIL_APP_PASSWORD": "${{ secrets.GMAIL_APP_PASSWORD }}",
"SITE_URL": "${{ secrets.SITE_URL }}"}}
]}}}
